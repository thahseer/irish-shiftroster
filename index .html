<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ClinicShift Roster</title>
<meta name="description" content="Cloud-based clinic staff shift roster and HR approval system with role-based access, live roster, requests and audit trail.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --surface-2:#EAF1EF; --surface-3:#DEEAE7;
  --border:#D3E1DD; --border-strong:#B7CCC6;
  --text:#12211E; --text-dim:#55665F; --text-faint:#8496905b;
  --primary:#0F6E63; --primary-dark:#0A4B44; --primary-tint:#DFF0EC; --primary-tint-2:#CDE7E1;
  --blue:#2F5FC4; --blue-tint:#E4EBFA;
  --amber:#B4790A; --amber-tint:#FBEFD8;
  --red:#C13F3F; --red-tint:#FBE6E6;
  --green:#1E8A55; --green-tint:#E2F5EA;
  --purple:#7A4FB0; --purple-tint:#EFE6F8;
  --shadow: 0 1px 2px rgba(15,40,35,.06), 0 6px 20px -8px rgba(15,40,35,.12);
  --radius: 10px;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-display: 'Fraunces', Georgia, serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1613; --surface:#12211D; --surface-2:#182E28; --surface-3:#1F3A32;
    --border:#25423A; --border-strong:#345A4E;
    --text:#E7F1EE; --text-dim:#9FB6AF; --text-faint:#6d8a815b;
    --primary:#3FBBA9; --primary-dark:#2E9787; --primary-tint:#153630; --primary-tint-2:#1B4239;
    --blue:#7DA0F0; --blue-tint:#18213F;
    --amber:#E3B255; --amber-tint:#3A2E10;
    --red:#E88888; --red-tint:#3A1B1B;
    --green:#6FCB9A; --green-tint:#123626;
    --purple:#C4A6E8; --purple-tint:#2A1F3C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1613; --surface:#12211D; --surface-2:#182E28; --surface-3:#1F3A32;
  --border:#25423A; --border-strong:#345A4E;
  --text:#E7F1EE; --text-dim:#9FB6AF; --text-faint:#6d8a815b;
  --primary:#3FBBA9; --primary-dark:#2E9787; --primary-tint:#153630; --primary-tint-2:#1B4239;
  --blue:#7DA0F0; --blue-tint:#18213F;
  --amber:#E3B255; --amber-tint:#3A2E10;
  --red:#E88888; --red-tint:#3A1B1B;
  --green:#6FCB9A; --green-tint:#123626;
  --purple:#C4A6E8; --purple-tint:#2A1F3C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
a{color:var(--primary)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---- shell ---- */
#shell{display:flex;min-height:100%;height:100%}
html,body,#shell{height:100%}
#sidebar{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .2s ease}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--border)}
#sidebar .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:600;font-size:16px;flex:none}
#sidebar .brand .name{font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.1}
#sidebar .brand .sub{font-size:10.5px;color:var(--text-dim);letter-spacing:.03em;text-transform:uppercase}
#navScroll{flex:1;overflow-y:auto;padding:10px 10px 14px}
.nav-group{margin-top:14px}
.nav-group:first-child{margin-top:4px}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);padding:0 10px;margin-bottom:4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text-dim);font-size:13.2px;font-weight:500;position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-tint);color:var(--primary-dark)}
.nav-item .ic{width:17px;text-align:center;flex:none;opacity:.85}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:1px 6px;min-width:16px;text-align:center}
#main{margin-left:236px;flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px}
#menuBtn{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
#pageTitle{font-family:var(--font-display);font-size:19px;font-weight:600}
#pageSub{font-size:11.5px;color:var(--text-dim)}
#searchBox{flex:1;max-width:340px;display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
#searchBox input{background:none;border:none;outline:none;flex:1;color:var(--text)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.role-chip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 6px;cursor:pointer;font-size:12.5px;font-weight:600}
.role-chip .av{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:15px}
.iconbtn .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--surface)}
#content{padding:20px;padding-bottom:60px;max-width:1400px;width:100%}
.livebar{background:var(--primary-tint);border-bottom:1px solid var(--primary-tint-2);color:var(--primary-dark);font-size:12px;font-weight:600;padding:6px 20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}

/* ---- generic components ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:17px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 13px;font-weight:600;font-size:12.8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.stat .lbl{font-size:10.8px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:600}
.stat .val{font-family:var(--font-display);font-size:26px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.stat.warn{border-color:#e2b45a55;background:var(--amber-tint)}
.stat.warn .val{color:var(--amber)}
.stat.bad{border-color:#c1616155;background:var(--red-tint)}
.stat.bad .val{color:var(--red)}
.stat.good{background:var(--green-tint)}
.stat.good .val{color:var(--green)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.badge.draft{background:var(--surface-3);color:var(--text-dim)}
.badge.pendingmgr,.badge.pendinghr,.badge.submitted{background:var(--amber-tint);color:var(--amber)}
.badge.approved,.badge.confirmed{background:var(--green-tint);color:var(--green)}
.badge.rejected{background:var(--red-tint);color:var(--red)}
.badge.cancelled{background:var(--surface-3);color:var(--text-faint)}
.badge.emergency{background:var(--red);color:#fff}
.badge.off{background:var(--surface-3);color:var(--text-dim)}
.badge.leave{background:var(--purple-tint);color:var(--purple)}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table.data th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.data td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12.8px;white-space:nowrap}
table.data tr:last-child td{border-bottom:none}
table.data tr:hover td{background:var(--surface-2)}
.emp-cell{display:flex;align-items:center;gap:8px}
.emp-cell .av{width:26px;height:26px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--text-dim);flex:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:6px 9px;font-size:12.3px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:11.5px;font-weight:600;color:var(--text-dim)}
.field input,.field select,.field textarea{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}

.modal-bg{position:fixed;inset:0;background:rgba(10,20,18,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-bottom:5vh}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px}
.modal-body{padding:18px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.close-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-dim);width:28px;height:28px;border-radius:6px}
.close-x:hover{background:var(--surface-2)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 14px;font-size:12.8px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--primary-dark);border-color:var(--primary)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim)}
.empty-state .ic{font-size:32px;margin-bottom:8px}
.note{font-size:11.8px;color:var(--text-dim);background:var(--surface-2);border-radius:8px;padding:8px 11px;border:1px solid var(--border)}
.warnbox{background:var(--amber-tint);border:1px solid #d9a94655;color:var(--amber);border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:600}
.errbox{background:var(--red-tint);border:1px solid #c1616155;color:var(--red);border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:600}
.okbox{background:var(--green-tint);border:1px solid #2f8a5555;color:var(--green);border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:600}
.kpi-row{display:flex;gap:8px;flex-wrap:wrap}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:10px;padding:11px 14px;font-size:12.6px;font-weight:600;display:flex;gap:8px;align-items:flex-start;animation:in .18s ease}
.toast.ok{border-left:3px solid var(--green)}
.toast.warn{border-left:3px solid var(--amber)}
.toast.err{border-left:3px solid var(--red)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.overlay-onboard{position:fixed;inset:0;background:linear-gradient(160deg,var(--primary-dark),var(--primary));z-index:300;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;box-sizing:border-box}
.onboard-card{background:var(--surface);border-radius:16px;max-width:460px;width:100%;margin:24px auto;padding:26px 26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.4);box-sizing:border-box}
@media (max-width:480px){
  .onboard-card{margin:12px auto;padding:20px 18px 18px}
}
.role-opt{border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.role-opt:hover{border-color:var(--primary)}
.role-opt.sel{border-color:var(--primary);background:var(--primary-tint)}
.role-opt .ic{font-size:18px}
.role-opt .t{font-weight:700;font-size:13.2px}
.role-opt .d{font-size:11.2px;color:var(--text-dim)}

.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text-dim);margin-bottom:10px}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

@media print{
  #sidebar,#topbar,.livebar,.no-print{display:none!important}
  #main{margin-left:0!important}
  body{background:#fff;color:#000}
}

@media (max-width:900px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #menuBtn{display:flex;align-items:center;justify-content:center}
  #pageSub{display:none}
  #searchBox{display:none}
}
html,body{overflow-x:hidden;max-width:100%}
*{box-sizing:border-box}
img,svg{max-width:100%}
.table-wrap,.table-scroll,table.data{-webkit-overflow-scrolling:touch}
@media (max-width:600px){
  .field input,.field select,.field textarea,.filters select,.filters input{font-size:16px}
  .modal-body,.modal{max-width:100vw}
  .card,.card-pad{padding:14px}
  table.data th,table.data td{padding:8px 9px}
  .btn{padding:8px 12px}
}
@supports (-webkit-touch-callout: none){
  .field input,.field select,.field textarea,.filters select,.filters input{font-size:16px}
}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================================
   CLINICSHIFT ROSTER — data model, demo seed, and application shell
   ========================================================================= */

const ROLES = {
  SUPER_ADMIN: {label:'Super Admin / CEO', ic:'&#9813;', desc:'Full access to every module, all data, and system settings.'},
  HR_ADMIN:    {label:'HR Admin', ic:'&#128188;', desc:'Full operational control — masters, rosters, approvals, reports.'},
  MANAGER:     {label:'Department Manager', ic:'&#128101;', desc:'Reviews department roster & coverage, submits requests.'},
  EMPLOYEE:    {label:'Employee', ic:'&#128100;', desc:'View-only access to your own roster, leave and requests.'}
};
/* Role sign-in gate — every role now needs a password to enter.
   NOTE: this is a client-side-only app (no server), so this check runs entirely
   in the visitor's browser. It stops casual role-switching and keeps each
   module behind a password, but it is NOT real security — anyone can open
   DevTools/view-source and read this file, including the hashes below, or
   inspect what's saved in localStorage. Do not rely on this to protect
   confidential data; for that, the app needs a real backend that checks
   credentials server-side. Super Admin can change every role's password from
   the "Access Control" screen — those changes are saved in this browser's
   localStorage (and to the shared cloud database when this app is running
   in its connected/live edition), not by editing this file.               */
const DEFAULT_ROLE_CREDENTIALS = {
  SUPER_ADMIN: { email: 'thahseer2011@gmail.com', passHash: '5c86cfde2149edef0445094c05b30e0b87ef7e611b82af78f45b0688ab65d296' },
  HR_ADMIN:    { passHash: '5539dd79ae9fd2d106c2bbd5d1e6670e43d861a9b43d448fd471f43abdee9e76' }, // default: HR@12345
  MANAGER:     { passHash: '395ab754663c7cc43b680f87c88beaee611dbc2e9205ce2a80d7b8f55dd8216e' }, // default: Mgr@12345
  EMPLOYEE:    { passHash: '80eedf88ee148c3759b4d14f152f7fa9936acc524d209c2f2ea8e2cd9ce67448' }  // default: Emp@12345
};
const CRED_STORE_KEY = 'clinicshift_credentials';
function loadRoleCredentials(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(CRED_STORE_KEY)||'null'); }catch(e){}
  const merged = JSON.parse(JSON.stringify(DEFAULT_ROLE_CREDENTIALS));
  if(saved && typeof saved==='object'){
    for(const role of Object.keys(merged)){
      if(saved[role] && typeof saved[role]==='object') Object.assign(merged[role], saved[role]);
    }
  }
  return merged;
}
let ROLE_CREDENTIALS = loadRoleCredentials();
function saveRoleCredentials(){
  try{ localStorage.setItem(CRED_STORE_KEY, JSON.stringify(ROLE_CREDENTIALS)); }catch(e){}
  if(S.db){ S.db.doc('data/app/credentials').set(ROLE_CREDENTIALS).catch(()=>{}); }
}
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function setRolePassword(role, newPassword){
  ROLE_CREDENTIALS[role].passHash = await sha256Hex(newPassword);
  saveRoleCredentials();
}
async function setSuperAdminLogin(newEmail, newPassword){
  if(newEmail) ROLE_CREDENTIALS.SUPER_ADMIN.email = newEmail.trim().toLowerCase();
  if(newPassword) ROLE_CREDENTIALS.SUPER_ADMIN.passHash = await sha256Hex(newPassword);
  saveRoleCredentials();
}
const uid = (p)=>p+'-'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const todayISO = ()=> new Date().toISOString().slice(0,10);
const pad2 = n => String(n).padStart(2,'0');
const fmtDate = (iso)=>{ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const fmtDateTime = (iso)=>{ const d=new Date(iso); if(isNaN(d)) return '—'; return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const dayName = (iso)=> ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(iso+'T00:00:00Z').getUTCDay()];
const weekdayIdx = (iso)=> new Date(iso+'T00:00:00Z').getUTCDay();
const monthKey = (y,m)=> `${y}-${pad2(m)}`;
const monthLabel = (key)=>{ const [y,m]=key.split('-'); return new Date(y,m-1,1).toLocaleString('en-GB',{month:'long',year:'numeric'}); };
const daysInMonth = (y,m)=> new Date(y,m,0).getDate();
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }

/* ---------------- demo master data ---------------- */

function shiftHours(code){
  const s = SHIFTS.find(x=>x.code===code); if(!s||!s.work) return 0;
  const [sh,sm]=s.start.split(':').map(Number), [eh,em]=s.end.split(':').map(Number);
  return Math.round((((eh*60+em)-(sh*60+sm)-s.breakMin)/60)*100)/100;
}

/* ---------------- roster month generation ---------------- */
function generateMonthEntries(year, month, employees, leaves){
  const entries = [];
  const dim = daysInMonth(year, month);
  for(let d=1; d<=dim; d++){
    const iso = `${year}-${pad2(month)}-${pad2(d)}`;
    const wd = weekdayIdx(iso);
    employees.forEach(emp=>{
      if(emp.status!=='Active') return;
      let code = emp.standardShift, leaveType=null, onLeaveApproved=false;
      const lv = leaves.find(l=> l.employeeId===emp.id && l.status==='Approved' && iso>=l.startDate && iso<=l.endDate);
      if(lv && !lv.overrideWorked){ code = lv.leaveType; leaveType=lv.leaveType; onLeaveApproved=true; }
      else if(wd===emp.weeklyOff){ code='OFF'; }
      entries.push({id:uid('re'), date:iso, employeeId:emp.id, shiftCode:code, leaveType, onLeaveApproved, emergency:false, changeNote:null});
    });
  }
  return entries;
}
function emptyMonthDoc(key,year,month,entries,preparedBy){
  return { key, year, month, status:'DRAFT', versionLabel:'Draft v1', draftVersion:1, finalVersion:0,
    preparedBy, preparedAt:new Date().toISOString(),
    managerReviewedBy:null, managerReviewedAt:null, managerRemarks:'',
    hrConfirmedBy:null, hrConfirmedAt:null, hrRemarks:'',
    lastUpdated:new Date().toISOString(), updatedBy:preparedBy, entries };
}

/* ---------------- seed full state ---------------- */
function buildSeedState(){
  const employees = buildEmployees();
  const now = new Date();
  const thisY = now.getFullYear(), thisM = now.getMonth()+1;
  // leave: one approved (covers a recent+upcoming range) + one pending for HR queue
  const leaves = [
    {id:uid('lv'), employeeId:'EMP008', departmentId:'DEP-NURSING', leaveType:'AL', startDate:isoOffset(now,-2), endDate:isoOffset(now,3), days:6, reason:'Annual family travel', requestedBy:'EMP008', approvedBy:'EMP020', status:'Approved', remarks:'Approved by HR', overrideWorked:false, createdAt:isoOffset(now,-10)},
    {id:uid('lv'), employeeId:'EMP011', departmentId:'DEP-RECEPTION', leaveType:'SL', startDate:isoOffset(now,2), endDate:isoOffset(now,3), days:2, reason:'Medical appointment', requestedBy:'EMP011', approvedBy:null, status:'Pending', remarks:'', overrideWorked:false, createdAt:isoOffset(now,0)},
  ];
  const entries = generateMonthEntries(thisY, thisM, employees, leaves);
  // bake a staffing shortage: pull one reception M1 person OFF via emergency, 5 days from today
  const shortageDate = isoOffset(now,5);
  const recM1 = entries.filter(e=>e.date===shortageDate && employees.find(x=>x.id===e.employeeId && x.departmentId==='DEP-RECEPTION') && e.shiftCode==='M1');
  if(recM1.length>1){ recM1[0].shiftCode='SL'; recM1[0].leaveType='SL'; recM1[0].changeNote='Unplanned sick leave (demo shortage)'; }
  const mKey = monthKey(thisY,thisM);
  const monthDoc = emptyMonthDoc(mKey, thisY, thisM, entries, 'EMP020');
  monthDoc.status='CONFIRMED'; monthDoc.versionLabel='Final v1'; monthDoc.finalVersion=1;
  monthDoc.managerReviewedBy='EMP002'; monthDoc.managerReviewedAt=isoOffset(now,-6);
  monthDoc.hrConfirmedBy='EMP020'; monthDoc.hrConfirmedAt=isoOffset(now,-5);
  monthDoc.lastUpdated = isoOffset(now,-5); monthDoc.updatedBy='EMP020';

  // next month: draft, awaiting manager review (for walking the approval workflow)
  let nextY=thisY, nextM=thisM+1; if(nextM>12){nextM=1;nextY++;}
  const nextEntries = generateMonthEntries(nextY, nextM, employees, leaves);
  const nextKey = monthKey(nextY,nextM);
  const nextDoc = emptyMonthDoc(nextKey, nextY, nextM, nextEntries, 'EMP020');
  nextDoc.status='PENDING_MANAGER';

  const requests = [
    {id:uid('req'), employeeId:'EMP013', departmentId:'DEP-DENTAL', date:isoOffset(now,4), currentShift:'M1', requestedShift:'M2', reason:'Childcare drop-off changed this week', requestedBy:'EMP013', requestDate:isoOffset(now,-1), managerApproval:'Pending', hrDecision:'Pending', hrRemarks:'', approvedBy:null, approvalDate:null, status:'Pending Manager', emergency:false},
  ];
  const changelog = [
    {id:uid('chg'), date:isoOffset(now,-30), employeeId:'EMP009', originalShift:'M2', newShift:'E1', reason:'Standard shift updated at joining review', requestedBy:'EMP002', approvedBy:'EMP020', approvalTime:isoOffset(now,-30), updatedBy:'EMP020', emergency:false, monthKey:null},
    {id:uid('chg'), date:isoOffset(now,-14), employeeId:'EMP011', originalShift:'M1', newShift:'M2', reason:'Approved shift-change request', requestedBy:'EMP011', approvedBy:'EMP020', approvalTime:isoOffset(now,-14), updatedBy:'EMP020', emergency:false, monthKey:mKey},
    {id:uid('chg'), date:shortageDate, employeeId:recM1[0]?recM1[0].employeeId:'EMP010', originalShift:'M1', newShift:'SL', reason:'Unplanned sick leave (demo shortage)', requestedBy:'EMP020', approvedBy:'EMP020', approvalTime:isoOffset(now,-1), updatedBy:'EMP020', emergency:true, monthKey:mKey},
  ];
  const notifications = [
    {id:uid('ntf'), type:'roster_published', text:`Roster for ${monthLabel(mKey)} published — FINAL, HR Confirmed.`, time:isoOffset(now,-5), read:false, audience:'ALL'},
    {id:uid('ntf'), type:'leave_pending', text:`Leave request from John Dsouza is awaiting HR decision.`, time:isoOffset(now,0), read:false, audience:'HR'},
    {id:uid('ntf'), type:'request_pending', text:`Shift-change request from Ana Reyes needs manager review.`, time:isoOffset(now,-1), read:false, audience:'MANAGER'},
    {id:uid('ntf'), type:'emergency', text:`Emergency change applied: ${employees.find(e=>e.id===(recM1[0]?recM1[0].employeeId:'EMP010')).name} moved to Sick Leave on ${fmtDate(shortageDate)}.`, time:isoOffset(now,-1), read:false, audience:'ALL'},
  ];
  return {
    settings:{ clinicName:'Bright Smiles Clinic', seeded:true, seededAt:new Date().toISOString() },
    departments: DEPARTMENTS.slice(), positions: POSITIONS.slice(), shifts: SHIFTS.slice(),
    employees, coverage: COVERAGE.slice(), leaves, requests, changelog, notifications,
    checklist:{}, meta:{lastUpdated:new Date().toISOString(), updatedBy:'EMP020'},
    _months:{ [mKey]: monthDoc, [nextKey]: nextDoc }
  };
}
function isoOffset(base,days){ const d=new Date(base); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

function toast(msg,kind='ok'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast '+kind;
  el.innerHTML = `<span>${kind==='ok'?'&#9989;':kind==='warn'?'&#9888;':'&#10060;'}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3800);
}

function scheduleSave(){
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(doSaveState, 450);
}
async function doSaveState(){
  S.state.meta = {lastUpdated:new Date().toISOString(), updatedBy: S.role==='EMPLOYEE'?(currentEmployee()?currentEmployee().name:'Employee'):viewerLabel()};
  const {_months, ...persist} = S.state;
  const str = JSON.stringify(persist);
  S.lastSavedStateStr = str;
  if(S.db){
    try{ await S.db.doc('clinic/state').set(persist); }
    catch(e){ /* best effort */ }
  } else {
    try{ localStorage.setItem('clinicshift_state', str); }catch(e){}
  }
}
async function saveMonth(key){
  const doc = S.months[key]; if(!doc) return;
  doc.lastUpdated = new Date().toISOString();
  const str = JSON.stringify(doc);
  S.lastSavedMonthStr[key] = str;
  if(S.db){
    try{ await S.db.collection('rosterMonths').doc(key).set(doc); }
    catch(e){}
  } else {
    try{
      const all = JSON.parse(localStorage.getItem('clinicshift_months')||'{}');
      all[key] = doc;
      localStorage.setItem('clinicshift_months', JSON.stringify(all));
    }catch(e){}
  }
}
async function ensureMonthLoaded(key){
  if(S.months[key] || S.monthLoading[key]) return;
  if(S.state._months && S.state._months[key]){ S.months[key]=S.state._months[key]; return; }
  S.monthLoading[key]=true;
  if(S.db){
    try{
      const snap = await S.db.collection('rosterMonths').doc(key).get();
      if(snap.exists){ S.months[key]=snap.data(); }
    }catch(e){}
  } else {
    try{
      const all = JSON.parse(localStorage.getItem('clinicshift_months')||'{}');
      if(all[key]){ S.months[key]=all[key]; }
    }catch(e){}
  }
  S.monthLoading[key]=false;
}
function subscribeMonth(key){
  if(!S.db) return;
  if(S.unsubMonth) { S.unsubMonth(); S.unsubMonth=null; }
  S.unsubMonth = S.db.collection('rosterMonths').doc(key).onSnapshot(snap=>{
    if(!snap.exists) return;
    const str = JSON.stringify(snap.data());
    if(str !== S.lastSavedMonthStr[key]){
      S.months[key] = snap.data();
      render();
    }
  }, ()=>{});
}

function coverageShortagesFor(key){
  const doc = S.months[key]; if(!doc) return [];
  const byDateShiftDept = {};
  doc.entries.forEach(e=>{
    const emp = S.state.employees.find(x=>x.id===e.employeeId); if(!emp) return;
    const shift = S.state.shifts.find(s=>s.code===e.shiftCode);
    if(!shift || !shift.work) return;
    const k = e.date+'|'+emp.departmentId+'|'+e.shiftCode;
    byDateShiftDept[k]=(byDateShiftDept[k]||0)+1;
  });
  const out=[];
  S.state.coverage.forEach(rule=>{
    for(let d=1; d<=daysInMonth(doc.year,doc.month); d++){
      const iso = `${doc.year}-${pad2(doc.month)}-${pad2(d)}`;
      const k = iso+'|'+rule.departmentId+'|'+rule.shiftCode;
      const scheduled = byDateShiftDept[k]||0;
      if(scheduled < rule.min){
        out.push({date:iso, departmentId:rule.departmentId, shiftCode:rule.shiftCode, required:rule.min, scheduled, shortage:rule.min-scheduled});
      }
    }
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

function applyShiftChangeToRoster(dateIso, employeeId, newShiftCode, note, emergency){
  const key = dateIso.slice(0,7);
  ensureMonthLoaded(key);
  const doc = S.months[key];
  if(!doc){ return false; }
  const entry = doc.entries.find(e=>e.date===dateIso && e.employeeId===employeeId);
  if(!entry) return false;
  const original = entry.shiftCode;
  entry.shiftCode = newShiftCode; entry.changeNote = note||null; entry.emergency = !!emergency;
  if(doc.status==='CONFIRMED'){ doc.finalVersion += 1; doc.versionLabel = 'Final v'+doc.finalVersion; }
  doc.lastUpdated = new Date().toISOString(); doc.updatedBy = viewerLabel();
  saveMonth(key);
  return {original};
}

function statusBadge(status){

let _onboardRole=null, _onboardDept=null, _onboardEmp=null, _onboardName='';
function bindOnboarding(){
  const emps = S.state ? S.state.employees : buildEmployees();
  const depts = S.state ? S.state.departments : DEPARTMENTS;
  document.querySelectorAll('.role-opt').forEach(el=>el.addEventListener('click',()=>{
    _onboardRole = el.dataset.role;
    document.querySelectorAll('.role-opt').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    const extra = document.getElementById('onboardExtra');
    const enterBtn = document.getElementById('enterBtn');
    const passField = `<div class="field"><label>Password</label><input type="password" id="rolePass" autocomplete="current-password" placeholder="Password"></div>
        <div id="roleErr" style="color:#B3261E;font-size:11.5px;min-height:16px"></div>`;
    if(_onboardRole==='SUPER_ADMIN'){
      extra.innerHTML = `<div class="field"><label>Super Admin email</label><input type="email" id="saEmail" autocomplete="username" placeholder="name@example.com"></div>${passField}`;
    } else if(_onboardRole==='MANAGER'){
      extra.innerHTML = `<div class="field"><label>Your department</label><select id="pickDept">${depts.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div>${passField}`;
      document.getElementById('pickDept').addEventListener('change',e=>_onboardDept=e.target.value);
      _onboardDept = depts[0].id;
    } else if(_onboardRole==='EMPLOYEE'){
      extra.innerHTML = `<div class="field"><label>You are</label><select id="pickEmp">${emps.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(e.position)}</option>`).join('')}</select></div>${passField}`;
      document.getElementById('pickEmp').addEventListener('change',e=>_onboardEmp=e.target.value);
      _onboardEmp = emps[0].id;
    } else { extra.innerHTML = passField; }
    enterBtn.disabled = true;
    const check = ()=>{
      const passOk = document.getElementById('rolePass').value.length>0;
      const emailEl = document.getElementById('saEmail');
      enterBtn.disabled = !(passOk && (!emailEl || emailEl.value));
      const errEl = document.getElementById('roleErr'); if(errEl) errEl.textContent='';
    };
    document.getElementById('rolePass').addEventListener('input', check);
    document.getElementById('saEmail')?.addEventListener('input', check);
    const submitOnEnter = e=>{ if(e.key==='Enter' && !enterBtn.disabled) enterWorkspace(); };
    document.getElementById('rolePass').addEventListener('keydown', submitOnEnter);
    document.getElementById('saEmail')?.addEventListener('keydown', submitOnEnter);
    document.getElementById('rolePass').focus();
    document.getElementById('rolePass').scrollIntoView({block:'center', behavior:'smooth'});
  }));
  document.getElementById('enterBtn').addEventListener('click', enterWorkspace);
}
async function enterWorkspace(){
  const passEl = document.getElementById('rolePass'), errEl = document.getElementById('roleErr');
  const pass = passEl ? passEl.value : '';
  const passHash = await sha256Hex(pass);
  const cred = ROLE_CREDENTIALS[_onboardRole];
  let ok = cred && passHash === cred.passHash;
  if(_onboardRole==='SUPER_ADMIN'){
    const email = (document.getElementById('saEmail').value||'').trim().toLowerCase();
    ok = ok && email === cred.email.toLowerCase();
  }
  if(!ok){
    if(errEl) errEl.textContent = _onboardRole==='SUPER_ADMIN' ? 'Incorrect email or password.' : 'Incorrect password.';
    if(passEl){ passEl.value=''; passEl.focus(); }
    return;
  }
  S.role = _onboardRole;
  S.deptId = _onboardRole==='MANAGER' ? _onboardDept : null;
  S.empId = _onboardRole==='EMPLOYEE' ? _onboardEmp : null;
  try{
    localStorage.setItem('clinicshift_role', JSON.stringify({role:S.role, deptId:S.deptId, empId:S.empId}));
  }catch(e){}
  if(S.userCap){
    S.userCap.id().then(id=>{
      if(id && S.db){ S.db.doc('data/users/'+id+'/profile').set({role:S.role, deptId:S.deptId, empId:S.empId}).catch(()=>{}); }
    }).catch(()=>{});
  }
  S.ready = true;
  if(!S.state.settings.seeded){ seedIfNeeded(); }
  render();
}

function viewDashboard(){
  const key = currentMonthKey();
  ensureMonthLoaded(key);
  const doc = S.months[key];
  const today = todayISO();
  const emps = visibleEmployees();
  const todays = doc ? doc.entries.filter(e=>e.date===today && emps.some(x=>x.id===e.employeeId)) : [];
  const working = todays.filter(e=>{const s=S.state.shifts.find(x=>x.code===e.shiftCode); return s&&s.work;}).length;
  const off = todays.filter(e=>e.shiftCode==='OFF').length;
  const al = todays.filter(e=>e.shiftCode==='AL').length;
  const sl = todays.filter(e=>e.shiftCode==='SL').length;
  const otherLeave = todays.filter(e=>['EL','UL','OL','PH'].includes(e.shiftCode)).length;
  const pendingReq = S.state.requests.filter(r=>!['Approved','Rejected','Cancelled'].includes(r.status)).length;
  const pendingHR = pendingHRCount();
  const pendingMgr = S.state.requests.filter(r=>r.status==='Pending Manager').length + Object.values(S.months).filter(m=>m.status==='PENDING_MANAGER').length;
  const shortages = doc ? coverageShortagesFor(key).filter(s=>s.date>=today) : [];
  const upcomingLeave = S.state.leaves.filter(l=>l.status==='Approved' && l.endDate>=today).slice(0,6);

  const deptToday = {};
  todays.forEach(e=>{ const emp=S.state.employees.find(x=>x.id===e.employeeId); if(!emp) return; deptToday[emp.departmentId]=deptToday[emp.departmentId]||{working:0,total:0}; deptToday[emp.departmentId].total++; const s=S.state.shifts.find(x=>x.code===e.shiftCode); if(s&&s.work) deptToday[emp.departmentId].working++; });

  return `
  <div class="grid-stats">
    ${statCard('Total Employees', emps.length,'')}
    ${statCard('Working Today', working,'','good')}
    ${statCard('Weekly Off', off,'')}
    ${statCard('Annual Leave', al,'')}
    ${statCard('Sick Leave', sl,'')}
    ${statCard('Other Leave', otherLeave,'')}
    ${statCard('Pending Shift Requests', pendingReq,'','warn')}
    ${statCard('Pending Manager Approvals', pendingMgr,'','warn')}
    ${statCard('Pending HR Approvals', pendingHR,'', pendingHR? 'bad':'')}
    ${statCard('Staffing Shortages', shortages.length,'', shortages.length?'bad':'good')}
  </div>
  <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px" class="dash-grid">
  <div class="card card-pad">
    <div class="section-head"><h2>Today's Shift Coverage</h2><span class="note">${fmtDate(today)} · ${dayName(today)}</span></div>
    ${Object.keys(deptToday).length? `<div class="table-wrap"><table class="data"><thead><tr><th>Department</th><th>Working</th><th>Total</th><th>Coverage</th></tr></thead><tbody>
      ${Object.entries(deptToday).map(([id,v])=>`<tr><td>${esc(deptName(id))}</td><td>${v.working}</td><td>${v.total}</td><td><div style="background:var(--surface-3);border-radius:6px;height:8px;width:120px;overflow:hidden"><div style="height:100%;background:var(--primary);width:${Math.min(100,v.total?v.working/v.total*100:0)}%"></div></div></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state">No roster loaded for today yet.</div>`}
  </div>
  <div class="card card-pad">
    <div class="section-head"><h2>Staffing Shortages</h2></div>
    ${shortages.length? `<div style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto">
      ${shortages.slice(0,8).map(s=>`<div class="errbox" style="display:flex;justify-content:space-between;gap:8px"><span>${esc(deptName(s.departmentId))} · ${esc(shiftName(s.shiftCode))}<br><span class="mono" style="font-weight:400">${fmtDate(s.date)}</span></span><span style="text-align:right">Req ${s.required} / Sched ${s.scheduled}<br><b>Short ${s.shortage}</b></span></div>`).join('')}
    </div>` : `<div class="okbox">No staffing shortages detected for upcoming dates.</div>`}
    <div class="section-head" style="margin-top:16px"><h2>Upcoming Leave</h2></div>
    ${upcomingLeave.length? `<div class="table-wrap"><table class="data"><thead><tr><th>Employee</th><th>Type</th><th>Dates</th></tr></thead><tbody>
      ${upcomingLeave.map(l=>`<tr><td>${esc(empName(l.employeeId))}</td><td>${esc(l.leaveType)}</td><td class="mono">${fmtDate(l.startDate)}–${fmtDate(l.endDate)}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="note">No upcoming approved leave.</div>`}
  </div>
  </div>
  <style>@media (max-width:900px){.dash-grid{grid-template-columns:1fr!important}}</style>
  `;
}

function monthOptionsList(){
  const now=new Date(); const opts=[];
  for(let i=-2;i<=3;i++){ let y=now.getFullYear(), m=now.getMonth()+1+i; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} const k=monthKey(y,m); opts.push(`<option value="${k}" ${k===mrState.key?'selected':''}>${monthLabel(k)}</option>`); }
  return opts.join('');
}

}

  const doc = S.months[key];

  let range = dateRangeFor(lrState.range, doc.year, doc.month);

      <select id="lrEmp"><option value="ALL">All employees</option>${S.state.employees.map(e=>`<option value="${e.id}" ${lrState.empFilter===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
    </div>

      ${rows.length? rows.map(r=>{
        const emp = S.state.employees.find(x=>x.id===r.employeeId); if(!emp) return '';

        </div>`;
      }).join('') : `<div class="empty-state">No entries for this range.</div>`}
    </div>
  </div>`;

function dateRangeFor(kind,year,month){
  const t = new Date();
  const list=[];
  if(kind==='today') list.push(todayISO());
  else if(kind==='tomorrow') list.push(isoOffset(t,1));
  else if(kind==='week'){ for(let i=0;i<7;i++) list.push(isoOffset(t,i)); }
  else { const dim=daysInMonth(year,month); for(let d=1;d<=dim;d++) list.push(`${year}-${pad2(month)}-${pad2(d)}`); }
  return list;
}

}

    </tbody></table></div>` : `<div class="empty-state">No shift-change requests yet.</div>`}

function requestActions(r){
  const btns=[];
  const isOwn = S.role==='EMPLOYEE' && r.employeeId===S.empId;
  if((isManager()||isHR()) && r.status==='Pending Manager' && !(S.role==='MANAGER' && isOwn)){
    if(!(isManager() && r.employeeId===S.empId)){
      btns.push(`<button class="btn sm primary" data-act="mgrApprove" data-id="${r.id}">Mgr Approve</button>`);
      btns.push(`<button class="btn sm danger" data-act="mgrReject" data-id="${r.id}">Mgr Reject</button>`);
    }
  }
  if(isHR() && r.status==='Pending HR' && r.employeeId!==S.empId){
    btns.push(`<button class="btn sm primary" data-act="hrApprove" data-id="${r.id}">HR Approve</button>`);
    btns.push(`<button class="btn sm danger" data-act="hrReject" data-id="${r.id}">HR Reject</button>`);
  }
  if(isOwn && ['Submitted','Pending Manager'].includes(r.status)) btns.push(`<button class="btn sm ghost" data-act="cancel" data-id="${r.id}">Cancel</button>`);
  return btns.join(' ') || '<span class="note">—</span>';
}
function bindRequests(){
  const nb=document.getElementById('newReqBtn'); if(nb) nb.addEventListener('click', openNewRequestModal);
  document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click', ()=>{
    const id=b.dataset.id, act=b.dataset.act;
    const r = S.state.requests.find(x=>x.id===id); if(!r) return;
    if(act==='mgrApprove'){ r.managerApproval='Approved'; r.status='Pending HR'; addNotification(`Request from ${empName(r.employeeId)} approved by manager — awaiting HR.`,'request_pending','HR'); toast('Approved — sent to HR'); }
    if(act==='mgrReject'){ r.managerApproval='Rejected'; r.status='Rejected'; addNotification(`Request from ${empName(r.employeeId)} rejected by manager.`,'request_rejected','EMPLOYEE'); toast('Request rejected','warn'); }
    if(act==='hrApprove'){
      if(r.employeeId===S.empId){ toast('You cannot approve your own request.','err'); return; }
      r.hrDecision='Approved'; r.status='Approved'; r.approvedBy=viewerLabel(); r.approvalDate=new Date().toISOString();
      const res = applyShiftChangeToRoster(r.date, r.employeeId, r.requestedShift, 'Approved shift-change request', false);
      if(res){
        addChangelog({date:r.date, employeeId:r.employeeId, originalShift:res.original, newShift:r.requestedShift, reason:r.reason, requestedBy:empName(r.requestedBy), approvedBy:viewerLabel(), approvalTime:new Date().toISOString(), updatedBy:viewerLabel(), emergency:false, monthKey:r.date.slice(0,7)});
        addNotification(`Shift change approved for ${empName(r.employeeId)} on ${fmtDate(r.date)} — Live Roster updated.`,'request_approved','ALL');
        toast('Approved — Live Roster updated');
      } else toast('Approved, but that date is not in a loaded roster month yet.','warn');
    }
    if(act==='hrReject'){ const reason=prompt('HR remarks for rejection:','Insufficient coverage on requested date'); r.hrDecision='Rejected'; r.status='Rejected'; r.hrRemarks=reason||''; addNotification(`Shift change request for ${empName(r.employeeId)} rejected by HR.`,'request_rejected','EMPLOYEE'); toast('Rejected','warn'); }
    if(act==='cancel'){ r.status='Cancelled'; toast('Request cancelled'); }
    scheduleSave(); render();
  }));
}
function openNewRequestModal(){
  const emps = S.role==='EMPLOYEE' ? S.state.employees.filter(e=>e.id===S.empId) : S.role==='MANAGER'? S.state.employees.filter(e=>e.departmentId===S.deptId) : S.state.employees;
  const body = `
    <div class="field"><label>Employee</label><select id="reqEmp">${emps.map(e=>`<option value="${e.id}" ${e.id===S.empId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>

      <div class="field"><label>Date</label><input type="date" id="reqDate" value="${todayISO()}"></div>
      <div class="field"><label>Requested shift</label><select id="reqShift">${S.state.shifts.filter(s=>s.work).map(s=>`<option value="${s.code}">${esc(s.name)} (${s.code})</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Reason</label><textarea id="reqReason" placeholder="Explain why this change is needed"></textarea></div>
  `;
  const foot = `<button class="btn ghost" id="cancelM">Cancel</button><button class="btn primary" id="submitReq">Submit Request</button>`;
  openModal('New Shift Change Request', body, foot);
  document.getElementById('cancelM').addEventListener('click', closeModal);
  document.getElementById('submitReq').addEventListener('click', ()=>{
    const empId = document.getElementById('reqEmp').value;
    const date = document.getElementById('reqDate').value;
    const shiftCode = document.getElementById('reqShift').value;
    const reason = document.getElementById('reqReason').value.trim();

    const monthDoc = S.months[key];
    const current = monthDoc ? (monthDoc.entries.find(e=>e.date===date && e.employeeId===empId)||{}).shiftCode : emp.standardShift;
    S.state.requests.unshift({id:uid('req'), employeeId:empId, departmentId:emp.departmentId, date, currentShift:current||emp.standardShift, requestedShift:shiftCode, reason, requestedBy:viewerLabel(), requestDate:new Date().toISOString(), managerApproval:'Pending', hrDecision:'Pending', hrRemarks:'', approvedBy:null, approvalDate:null, status:'Pending Manager', emergency:false});
    addNotification(`New shift-change request from ${emp.name} needs manager review.`,'request_pending','MANAGER');
    scheduleSave(); toast('Request submitted for manager review'); closeModal(); render();
  });
}

function viewShiftMaster(){
  return `<div class="card card-pad">
    <div class="section-head"><h2>Shift Master</h2><button class="btn primary sm" id="addShift">+ Add Shift</button></div>
    <p class="note">Times are fully configurable — nothing here is hard-coded. Weekly off, leave and holiday codes carry zero working hours.</p>
    <div class="table-wrap"><table class="data"><thead><tr><th>Code</th><th>Name</th><th>Start</th><th>End</th><th>Break</th><th>Hours</th><th>Actions</th></tr></thead><tbody>
      ${S.state.shifts.map(s=>`<tr><td class="mono">${esc(s.code)}</td><td>${esc(s.name)}</td><td class="mono">${s.start||'—'}</td><td class="mono">${s.end||'—'}</td><td class="mono">${s.work?s.breakMin+'m':'—'}</td><td class="mono">${shiftHoursFrom(s)}</td><td><button class="btn sm" data-editshift="${s.code}">Edit</button></td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
}
function shiftHoursFrom(s){ if(!s.work) return 0; const [sh,sm]=s.start.split(':').map(Number),[eh,em]=s.end.split(':').map(Number); return Math.round((((eh*60+em)-(sh*60+sm)-s.breakMin)/60)*100)/100; }
function bindShiftMaster(){
  document.getElementById('addShift')?.addEventListener('click',()=>shiftModal(null));
  document.querySelectorAll('[data-editshift]').forEach(b=>b.addEventListener('click',()=>shiftModal(b.dataset.editshift)));
}
function shiftModal(code){
  const s = code ? S.state.shifts.find(x=>x.code===code) : null;
  const body = `<div class="field-row"><div class="field"><label>Code</label><input id="sCode" value="${esc(s?s.code:'')}" ${s?'disabled':''}></div><div class="field"><label>Name</label><input id="sName" value="${esc(s?s.name:'')}"></div></div>
    <div class="field"><label><input type="checkbox" id="sWork" ${s&&s.work?'checked':''}> Counts as a working shift</label></div>
    <div class="field-row"><div class="field"><label>Start</label><input type="time" id="sStart" value="${s?s.start:'09:00'}"></div><div class="field"><label>End</label><input type="time" id="sEnd" value="${s?s.end:'17:00'}"></div></div>
    <div class="field"><label>Break (minutes)</label><input type="number" id="sBreak" value="${s?s.breakMin:60}"></div>`;
  openModal(s?'Edit Shift':'Add Shift', body, `<button class="btn ghost" id="cancelM">Cancel</button><button class="btn primary" id="saveShift">Save</button>`);
  document.getElementById('cancelM').addEventListener('click', closeModal);
  document.getElementById('saveShift').addEventListener('click',()=>{
    const codeV=document.getElementById('sCode').value.trim().toUpperCase();
    const work=document.getElementById('sWork').checked;
    const start=work?document.getElementById('sStart').value:'', end=work?document.getElementById('sEnd').value:'';
    if(work && start>=end){ toast('End time cannot be before or equal to start time.','err'); return; }
    const data={code:codeV,name:document.getElementById('sName').value.trim(),start,end,breakMin:Number(document.getElementById('sBreak').value)||0,work};
    if(s){ Object.assign(s,data); } else S.state.shifts.push(data);
    scheduleSave(); closeModal(); toast('Shift saved'); render();
  });
}

   LEAVE / OFF MANAGEMENT
   ========================================================================= */
function viewLeave(){
  let list = S.state.leaves.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(S.role==='EMPLOYEE') list = list.filter(l=>l.employeeId===S.empId);
  if(S.role==='MANAGER') list = list.filter(l=>l.departmentId===S.deptId);
  return `<div class="card card-pad">
    <div class="section-head"><h2>Leave / Weekly Off Management</h2><button class="btn primary sm" id="newLeave">+ Record Leave</button></div>
    <div class="table-wrap"><table class="data"><thead><tr><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead><tbody>
      ${list.map(l=>`<tr>
        <td>${esc(empName(l.employeeId))}</td><td>${badgeShift(l.leaveType)}</td><td class="mono">${fmtDate(l.startDate)}</td><td class="mono">${fmtDate(l.endDate)}</td><td>${l.days}</td>
        <td>${esc(l.reason)}</td><td>${statusBadge(l.status)}</td>
        <td>${isHR()&&l.status==='Pending'&&l.employeeId!==S.empId?`<button class="btn sm primary" data-lv="approve" data-id="${l.id}">Approve</button> <button class="btn sm danger" data-lv="reject" data-id="${l.id}">Reject</button>`:'<span class="note">—</span>'}</td>
      </tr>`).join('')}
    </tbody></table></div>
  </div>`;
}
function bindLeave(){
  document.getElementById('newLeave')?.addEventListener('click', openLeaveModal);
  document.querySelectorAll('[data-lv]').forEach(b=>b.addEventListener('click',()=>{
    const l = S.state.leaves.find(x=>x.id===b.dataset.id);
    if(b.dataset.lv==='approve'){
      l.status='Approved'; l.approvedBy=viewerLabel();
      applyApprovedLeaveToRoster(l);
      addNotification(`Leave approved for ${empName(l.employeeId)} (${l.leaveType}, ${fmtDate(l.startDate)}–${fmtDate(l.endDate)}).`,'leave_approved','ALL');
      toast('Leave approved and applied to the roster');
    } else {
      const reason = prompt('Reason for rejection:','Insufficient notice'); l.status='Rejected'; l.remarks=reason||'';
      addNotification(`Leave request for ${empName(l.employeeId)} rejected.`,'leave_rejected','EMPLOYEE');
      toast('Leave rejected','warn');
    }
    scheduleSave(); render();
  }));
}
function applyApprovedLeaveToRoster(leave){
  let d = new Date(leave.startDate+'T00:00:00Z');
  const end = new Date(leave.endDate+'T00:00:00Z');
  while(d<=end){
    const iso = d.toISOString().slice(0,10);
    const key = iso.slice(0,7);
    if(S.months[key]){
      const entry = S.months[key].entries.find(e=>e.date===iso && e.employeeId===leave.employeeId);
      if(entry && entry.shiftCode!=='OFF'){
        const original = entry.shiftCode;
        entry.shiftCode = leave.leaveType; entry.leaveType=leave.leaveType; entry.onLeaveApproved=true;
        addChangelog({date:iso, employeeId:leave.employeeId, originalShift:original, newShift:leave.leaveType, reason:'Leave approved: '+leave.reason, requestedBy:empName(leave.requestedBy)||leave.requestedBy, approvedBy:viewerLabel(), approvalTime:new Date().toISOString(), updatedBy:viewerLabel(), emergency:false, monthKey:key});
      }
      S.months[key].lastUpdated=new Date().toISOString(); S.months[key].updatedBy=viewerLabel();
      saveMonth(key);
    }
    d.setUTCDate(d.getUTCDate()+1);
  }
}
function openLeaveModal(){
  const emps = S.role==='EMPLOYEE'?S.state.employees.filter(e=>e.id===S.empId):S.role==='MANAGER'?S.state.employees.filter(e=>e.departmentId===S.deptId):S.state.employees;
  const body = `<div class="field"><label>Employee</label><select id="lEmp">${emps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
    <div class="field-row"><div class="field"><label>Leave Type</label><select id="lType">${['Annual Leave|AL','Sick Leave|SL','Emergency Leave|EL','Unpaid Leave|UL','Other Leave|OL','Public Holiday|PH'].map(x=>{const[n,c]=x.split('|');return `<option value="${c}">${n}</option>`;}).join('')}</select></div>
    <div class="field"><label>Override — allow working shift on leave date</label><select id="lOverride"><option value="0">No</option><option value="1">Yes (HR override)</option></select></div></div>
    <div class="field-row"><div class="field"><label>Start Date</label><input type="date" id="lStart" value="${todayISO()}"></div><div class="field"><label>End Date</label><input type="date" id="lEnd" value="${todayISO()}"></div></div>
    <div class="field"><label>Reason</label><textarea id="lReason"></textarea></div>`;
  openModal('Record Leave', body, `<button class="btn ghost" id="cancelM">Cancel</button><button class="btn primary" id="saveLeave">Submit</button>`);
  document.getElementById('cancelM').addEventListener('click', closeModal);
  document.getElementById('saveLeave').addEventListener('click',()=>{
    const employeeId=document.getElementById('lEmp').value, leaveType=document.getElementById('lType').value;
    const startDate=document.getElementById('lStart').value, endDate=document.getElementById('lEnd').value;
    const reason=document.getElementById('lReason').value.trim(), overrideWorked=document.getElementById('lOverride').value==='1';
    if(!reason){ toast('Reason is required.','err'); return; }
    if(endDate<startDate){ toast('End date cannot be before start date.','err'); return; }
    const days = Math.round((new Date(endDate)-new Date(startDate))/86400000)+1;
    const emp = S.state.employees.find(e=>e.id===employeeId);
    const status = isHR() ? 'Approved' : 'Pending';
    const leave = {id:uid('lv'), employeeId, departmentId:emp.departmentId, leaveType, startDate, endDate, days, reason, requestedBy:viewerLabel(), approvedBy: status==='Approved'?viewerLabel():null, status, remarks:'', overrideWorked, createdAt:new Date().toISOString()};
    S.state.leaves.unshift(leave);
    if(status==='Approved') applyApprovedLeaveToRoster(leave);
    else addNotification(`New leave request from ${emp.name} needs HR decision.`,'leave_pending','HR');
    scheduleSave(); toast(status==='Approved'?'Leave recorded and applied':'Leave submitted for HR approval'); closeModal(); render();
  });
}

function toCSV(rows, headers){
  const esc2 = v => { v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  return [headers.join(','), ...rows.map(r=>headers.map(h=>esc2(r[h])).join(','))].join('\r\n');
}

function exportReport(id){
  ensureMonthLoaded(mrState.key);
  const doc = S.months[mrState.key];
  let csv='', filename='report.csv';
  if(id==='monthlyRoster'){
    if(!doc){ toast('No roster for that month.','err'); return; }
    const rows = doc.entries.map(e=>{ const emp=S.state.employees.find(x=>x.id===e.employeeId); const sh=S.state.shifts.find(x=>x.code===e.shiftCode); return {Date:e.date, Day:dayName(e.date), EmployeeID:e.employeeId, Employee:emp?emp.name:'', Department:deptName(emp?.departmentId), Position:emp?emp.position:'', Shift:e.shiftCode, Start:sh&&sh.work?sh.start:'', End:sh&&sh.work?sh.end:'', Hours:shiftHours(e.shiftCode), Status:doc.status }; });
    csv = toCSV(rows, ['Date','Day','EmployeeID','Employee','Department','Position','Shift','Start','End','Hours','Status']); filename=`monthly-roster-${mrState.key}.csv`;
  } else if(id==='dailyStaffing'){
    const today=todayISO(); const rows = (doc?doc.entries:[]).filter(e=>e.date===today).map(e=>{const emp=S.state.employees.find(x=>x.id===e.employeeId); return {Department:deptName(emp?.departmentId), Employee:emp?emp.name:'', Position:emp?emp.position:'', Shift:e.shiftCode, Status:S.state.shifts.find(x=>x.code===e.shiftCode)?.work?'On Duty':'Off'};});

    if(!doc){ toast('No roster for that month.','err'); return; }
    const rows = doc.entries.map(e=>{const emp=S.state.employees.find(x=>x.id===e.employeeId); return {Department:deptName(emp?.departmentId), Date:e.date, Employee:emp?emp.name:'', Shift:e.shiftCode};}).sort((a,b)=>a.Department.localeCompare(b.Department));

  } else if(id==='employeeRoster'){
    csv = toCSV(S.state.employees.map(e=>({ID:e.id,Name:e.name,Department:deptName(e.departmentId),Position:e.position,Type:e.employmentType,Status:e.status,StandardShift:e.standardShift,WeeklyOff:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][e.weeklyOff]})), ['ID','Name','Department','Position','Type','Status','StandardShift','WeeklyOff']);

  } else if(id==='shiftChangeReport'){
    csv = toCSV(S.state.requests.map(r=>({Employee:empName(r.employeeId),Date:r.date,Current:r.currentShift,Requested:r.requestedShift,Status:r.status,Reason:r.reason})), ['Employee','Date','Current','Requested','Status','Reason']); filename='shift-change-report.csv';
  } else if(id==='summaryReport'){
    if(!doc){ toast('No roster for that month.','err'); return; }
    const rows = S.state.employees.map(e=>{ const es=doc.entries.filter(x=>x.employeeId===e.id); const working=es.filter(x=>S.state.shifts.find(s=>s.code===x.shiftCode)?.work); return {Employee:e.name, WorkingDays:working.length, WeeklyOff:es.filter(x=>x.shiftCode==='OFF').length, AnnualLeave:es.filter(x=>x.shiftCode==='AL').length, SickLeave:es.filter(x=>x.shiftCode==='SL').length, ScheduledHours:working.reduce((s,x)=>s+shiftHours(x.shiftCode),0)};});
    csv=toCSV(rows,['Employee','WorkingDays','WeeklyOff','AnnualLeave','SickLeave','ScheduledHours']); filename=`monthly-summary-${mrState.key}.csv`;
  } else if(id==='shortageReport'){
    if(!doc){ toast('No roster for that month.','err'); return; }
    const rows = coverageShortagesFor(mrState.key).map(s=>({Department:deptName(s.departmentId),Date:s.date,Shift:s.shiftCode,Required:s.required,Scheduled:s.scheduled,Shortage:s.shortage}));
    csv=toCSV(rows,['Department','Date','Shift','Required','Scheduled','Shortage']); filename=`staffing-shortage-${mrState.key}.csv`;
  } else if(id==='changeLogReport'){
    csv = toCSV(S.state.changelog.map(c=>({Date:c.date,Employee:c.employeeId?empName(c.employeeId):'System',Original:c.originalShift,New:c.newShift,Reason:c.reason,RequestedBy:c.requestedBy,ApprovedBy:c.approvedBy,ApprovalTime:c.approvalTime,Emergency:c.emergency?'Yes':'No'})), ['Date','Employee','Original','New','Reason','RequestedBy','ApprovedBy','ApprovalTime','Emergency']); filename='hr-change-log.csv';

        await setSuperAdminLogin(wantsEmail?emailVal:null, p1||null);
      } else {
        if(p1) await setRolePassword(role, p1);
      }
      document.getElementById('acPass_'+role).value='';

async function boot(){
  S.state = { settings:{clinicName:'Bright Smiles Clinic', seeded:false}, departments:[], positions:[], shifts:[], employees:[], coverage:[], leaves:[], requests:[], changelog:[], notifications:[], checklist:{}, meta:{}, _months:{} };

  // try runtime capabilities
  try{
    if(window.claude && window.claude.use){
      const [db,userCap,downloadsCap] = await Promise.all([
        window.claude.use('db').catch(()=>null),
        window.claude.use('user').catch(()=>null),
        window.claude.use('downloads').catch(()=>null),
      ]);
      S.db = db; S.userCap = userCap; S.downloadsCap = downloadsCap;
    }
  }catch(e){}

  S.dbAvailable = !!S.db;

  if(S.db){
    try{
      const snap = await S.db.doc('clinic/state').get();
      if(snap.exists){ Object.assign(S.state, snap.data(), {_months:{}}); }
      else {
        const seed = buildSeedState();
        Object.assign(S.state, seed);
        S.months = {...seed._months};
        for(const k of Object.keys(S.months)) saveMonth(k);
        await doSaveState();
      }
    }catch(e){ Object.assign(S.state, buildSeedState()); S.months = {...S.state._months}; }
    // subscribe for live updates
    S.unsubState = S.db.doc('clinic/state').onSnapshot(snap=>{
      if(!snap.exists) return;
      const data = snap.data();
      const str = JSON.stringify(data);
      if(str !== S.lastSavedStateStr){
        const cl = S.state.checklist; // keep any local-only ephemeral untouched merges minimal
        Object.assign(S.state, data);
        render();
      }
    }, ()=>{});
  } else {
    let restoredLocal = null;
    try{ const raw = localStorage.getItem('clinicshift_state'); if(raw) restoredLocal = JSON.parse(raw); }catch(e){}
    if(restoredLocal && restoredLocal.settings && restoredLocal.settings.seeded){
      Object.assign(S.state, restoredLocal, {_months:{}});
      try{ S.months = JSON.parse(localStorage.getItem('clinicshift_months')||'{}'); }catch(e){ S.months = {}; }
    } else {
      Object.assign(S.state, buildSeedState());
      S.months = {...S.state._months};
      for(const k of Object.keys(S.months)) saveMonth(k);
      doSaveState();
    }
  }

  // ensure current + next month loaded/subscribed
  const ck = currentMonthKey();
  await ensureMonthLoaded(ck);
  if(S.db) subscribeMonth(ck);

  // restore viewer identity
  let restored = null;
  try{ restored = JSON.parse(localStorage.getItem('clinicshift_role')||'null'); }catch(e){}
  if(S.userCap){
    try{
      const id = await S.userCap.id();
      if(id && S.db){
        const prof = await S.db.doc('data/users/'+id+'/profile').get();
        if(prof.exists) restored = prof.data();
      }
    }catch(e){}
  }
  if(restored && restored.role){
    S.role = restored.role; S.deptId = restored.deptId||null; S.empId = restored.empId||null;
    S.ready = true;
  }
  render();
}
boot();
</script>
